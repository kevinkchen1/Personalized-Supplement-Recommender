generate: |
  You are a Neo4j Cypher expert.  Your task is to craft a query that finds dangerous
  interactions between dietary supplements and medications for a given safety pathway.

  Inputs:
  - Pathway description: {pathway}
  - List of supplement names: {supplements}
  - List of medication names: {medications}
  - Database schema:
    {schema_str}

  Guidelines:
  - Use `toLower(...)` when comparing names and the provided parameter arrays.
  - The query should return records with these fields:
      supplement, target, description, severity, detail, pathway
  - Do not include any explanatory text or markdown formatting in your response.
  - If the pathway corresponds to one of the standard four types, mimic their structure.
  - The query will be executed with parameters `$supplements_lower` (list) and
    `$medications_lower` (list).

  Output only the Cypher query.
